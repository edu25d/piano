  <main class="app">
    <header class="topbar">

      <div class="score-paper" id="drop-zone" tabindex="0" aria-label="MusicXML 악보 표시 영역, 파일을 여기에 끌어다 놓으세요"><div class="score-scroll" id="score-scroll" tabindex="0" aria-label="악보 영역을 위아래로 스크롤해 살펴보세요"><div id="score-render" class="score-placeholder"><div class="placeholder-icon">♫</div><strong>작은 별 악보를 준비하고 있어요</strong><span>악보가 보이지 않으면 잠시 후 다시 확인해 주세요.</span></div></div></div>
